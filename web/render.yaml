# =============================================================
# Render Blueprint - Digital Product E-commerce Store (Laravel)
#
# Services:
#   1. digital-mysql   => MySQL 8 private service (not public)
#   2. digitalstore    => Laravel web service (Docker)
#
# Before deploying:
#   - Replace the web service `repo:` with YOUR GitHub repo.
#   - Set APP_KEY (paste the base64 key from your local .env).
#   - Set APP_URL to https://your-app-name.onrender.com once created.
#   - The MySQL "storage" and "web storage" disks persist between deploys.
# =============================================================

services:
  # ---------- MySQL 8 (private service, backed by a persistent disk) ----------
  - type: private_service
    name: digital-mysql
    runtime: docker
    repo: https://github.com/render-examples/mysql
    branch: master              # master = MySQL 8.0
    plan: starter               # private services require a paid plan
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql  # required - do NOT change this path
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: digital
      - key: MYSQL_USER
        value: mysql
      - key: MYSQL_PASSWORD
        sync: false              # set a strong password in the dashboard
      - key: MYSQL_ROOT_PASSWORD
        sync: false              # set a strong root password in the dashboard

  # ---------- Laravel web service (Docker) ----------
  - type: web
    name: digitalstore
    runtime: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/trading-web-production
    branch: main
    plan: starter                # required for the persistent storage disk below
    dockerfilePath: ./Dockerfile
    numInstances: 1              # keep 1 - migrations run on container start
    healthCheckPath: /
    disk:
      name: laravel-storage
      mountPath: /var/www/html/storage/app/public   # uploaded products, banners, logos
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false              # paste the base64 key from your local .env
      - key: APP_URL
        sync: false              # set to https://your-app-name.onrender.com
      - key: APP_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stack
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: digital-mysql
          type: private_service
          property: hostname
      - key: DB_PORT
        fromService:
          name: digital-mysql
          type: private_service
          property: port
      - key: DB_DATABASE
        value: digital
      - key: DB_USERNAME
        value: mysql
      - key: DB_PASSWORD
        fromService:
          name: digital-mysql
          type: private_service
          property: envVar
          envVar: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log